name: Publish frozen GLM hotfix wheels

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Must be pypi"
        required: true
        default: pypi
        type: choice
        options:
          - pypi

permissions:
  contents: read

concurrency:
  group: ktransformers-pypi-release
  cancel-in-progress: false

jobs:
  publish-frozen-wheels:
    name: Verify and publish frozen wheels
    if: github.repository == 'kvcache-ai/ktransformers' && inputs.target == 'pypi'
    runs-on: [self-hosted, linux, x64, gpu, kt-cpu]
    environment: prod

    env:
      RELEASE_ROOT: /home/yyj/kt-hotfix-release-20260827

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify immutable release artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd "$RELEASE_ROOT"
          test "$(sha256sum final-dist/ktransformers/ktransformers-0.7.0.post2-py3-none-any.whl | cut -d' ' -f1)" = "7f406b65125ee7f78a4d1042e6c8d55fb71e2130d8cce7676062c979541df2d1"
          test "$(sha256sum final-dist-clean/sglang-kt/sglang_kt-0.7.0.post2-py3-none-any.whl | cut -d' ' -f1)" = "b7e21694219654fdbb0fa5702406ea1a7cbf46dac27d306e819ae938aa3672aa"
          test "$(sha256sum dist/sgl-kernel/sgl_kernel-0.3.21.post1-cp310-abi3-linux_x86_64.whl | cut -d' ' -f1)" = "c429373efdbc2c4323021a374aefb76c021398a2d13c83a2fb1f33220eb8ecdd"
          test "$(sha256sum dist/transformers-kt/transformers_kt-5.6.0.post4-py3-none-any.whl | cut -d' ' -f1)" = "1b13a6f99d0d18c20c68454dcba10133f28f0173d6d18e054b4631d0d76ca488"

      - name: Confirm versions are unused
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            https://pypi.org/pypi/ktransformers/0.7.0.post2/json \
            https://pypi.org/pypi/sglang-kt/0.7.0.post2/json \
            https://pypi.org/pypi/sgl-kernel/0.3.21.post1/json \
            https://pypi.org/pypi/transformers-kt/5.6.0.post4/json; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$url")"
            test "$status" = "404"
          done

      - name: Install publisher and validate metadata
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade twine
          python -m twine check \
            "$RELEASE_ROOT/final-dist/ktransformers/ktransformers-0.7.0.post2-py3-none-any.whl" \
            "$RELEASE_ROOT/final-dist-clean/sglang-kt/sglang_kt-0.7.0.post2-py3-none-any.whl" \
            "$RELEASE_ROOT/dist/sgl-kernel/sgl_kernel-0.3.21.post1-cp310-abi3-linux_x86_64.whl" \
            "$RELEASE_ROOT/dist/transformers-kt/transformers_kt-5.6.0.post4-py3-none-any.whl"

      - name: Publish exact tested wheels to PyPI
        shell: bash
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TWINE_PASSWORD"
          python -m twine upload --non-interactive \
            "$RELEASE_ROOT/dist/sgl-kernel/sgl_kernel-0.3.21.post1-cp310-abi3-linux_x86_64.whl"
          python -m twine upload --non-interactive \
            "$RELEASE_ROOT/dist/transformers-kt/transformers_kt-5.6.0.post4-py3-none-any.whl"
          python -m twine upload --non-interactive \
            "$RELEASE_ROOT/final-dist-clean/sglang-kt/sglang_kt-0.7.0.post2-py3-none-any.whl"
          python -m twine upload --non-interactive \
            "$RELEASE_ROOT/final-dist/ktransformers/ktransformers-0.7.0.post2-py3-none-any.whl"

      - name: Verify PyPI visibility
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            https://pypi.org/pypi/ktransformers/0.7.0.post2/json \
            https://pypi.org/pypi/sglang-kt/0.7.0.post2/json \
            https://pypi.org/pypi/sgl-kernel/0.3.21.post1/json \
            https://pypi.org/pypi/transformers-kt/5.6.0.post4/json; do
            for attempt in $(seq 1 30); do
              status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$url")"
              if [ "$status" = "200" ]; then
                break
              fi
              test "$attempt" -lt 30
              sleep 10
            done
          done
