name: Publish frozen GLM hotfix wheels

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Must be pypi"
        required: true
        default: pypi
        type: choice
        options:
          - pypi

permissions:
  contents: read

concurrency:
  group: ktransformers-pypi-release
  cancel-in-progress: false

jobs:
  publish-frozen-wheels:
    name: Verify and publish frozen wheels
    if: github.repository == 'kvcache-ai/ktransformers' && inputs.target == 'pypi'
    runs-on: [self-hosted, linux, x64, gpu, kt-cpu]
    environment: prod

    env:
      RELEASE_ROOT: /home/yyj/kt-hotfix-release-20260827

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify immutable release artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd "$RELEASE_ROOT/final-dist-v5/release"
          sha256sum --check <<'EOF'
          7f406b65125ee7f78a4d1042e6c8d55fb71e2130d8cce7676062c979541df2d1  ktransformers-0.7.0.post2-py3-none-any.whl
          f64bd1dd2a6e9fd612f1e87e4f90e3924862314fbe4bb4d58d57d32267904faa  sgl_kernel_kt-0.3.21.post2-cp310-abi3-manylinux_2_35_x86_64.whl
          0d15b7b482f56aacc789dee81ee2d8db8f337f737ca3e0c81879cd6562e70c9f  sgl_kernel_kt_payload_1-0.3.21.post2-py3-none-manylinux_2_35_x86_64.whl
          b72df16d4665197697302c3017606ffe4e98585c08f843e1ff797e4a95847b78  sgl_kernel_kt_payload_2-0.3.21.post2-py3-none-manylinux_2_35_x86_64.whl
          d5689d730f78520f011ed30fed0a0342b5bbaf99fa0c10c1cd8ee1733d369f33  sgl_kernel_kt_payload_3-0.3.21.post2-py3-none-manylinux_2_35_x86_64.whl
          42d8f840407ce686524685537fb2a7680944dede4579796dd4da16b0120f3420  sgl_kernel_kt_payload_4-0.3.21.post2-py3-none-manylinux_2_35_x86_64.whl
          64e02d0d34e5e97c12b21291aa2d3912dae4d35a5899ccef198c707c195f6009  sgl_kernel_kt_payload_5-0.3.21.post2-py3-none-manylinux_2_35_x86_64.whl
          7746606bc002462cf8143370325b3637f7f51f09f497dad29ced843c14a5dde0  sglang_kt-0.7.0.post2-py3-none-any.whl
          1b13a6f99d0d18c20c68454dcba10133f28f0173d6d18e054b4631d0d76ca488  transformers_kt-5.6.0.post4-py3-none-any.whl
          EOF

      - name: Confirm versions are unused
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            https://pypi.org/pypi/ktransformers/0.7.0.post2/json \
            https://pypi.org/pypi/sglang-kt/0.7.0.post2/json \
            https://pypi.org/pypi/sgl-kernel-kt/0.3.21.post2/json \
            https://pypi.org/pypi/sgl-kernel-kt-payload-1/0.3.21.post2/json \
            https://pypi.org/pypi/sgl-kernel-kt-payload-2/0.3.21.post2/json \
            https://pypi.org/pypi/sgl-kernel-kt-payload-3/0.3.21.post2/json \
            https://pypi.org/pypi/sgl-kernel-kt-payload-4/0.3.21.post2/json \
            https://pypi.org/pypi/sgl-kernel-kt-payload-5/0.3.21.post2/json \
            https://pypi.org/pypi/transformers-kt/5.6.0.post4/json; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$url")"
            test "$status" = "404"
          done

      - name: Install publisher and validate metadata
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade twine
          python -m twine check "$RELEASE_ROOT/final-dist-v5/release/"*.whl

      - name: Publish exact tested wheels to PyPI
        shell: bash
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TWINE_PASSWORD"
          for wheel in "$RELEASE_ROOT/final-dist-v5/release/"sgl_kernel_kt_payload_*.whl; do
            python -m twine upload --non-interactive "$wheel"
          done
          python -m twine upload --non-interactive \
            "$RELEASE_ROOT/final-dist-v5/release/sgl_kernel_kt-0.3.21.post2-cp310-abi3-manylinux_2_35_x86_64.whl"
          python -m twine upload --non-interactive \
            "$RELEASE_ROOT/final-dist-v5/release/transformers_kt-5.6.0.post4-py3-none-any.whl"
          python -m twine upload --non-interactive \
            "$RELEASE_ROOT/final-dist-v5/release/sglang_kt-0.7.0.post2-py3-none-any.whl"
          python -m twine upload --non-interactive \
            "$RELEASE_ROOT/final-dist-v5/release/ktransformers-0.7.0.post2-py3-none-any.whl"

      - name: Verify PyPI visibility
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            https://pypi.org/pypi/ktransformers/0.7.0.post2/json \
            https://pypi.org/pypi/sglang-kt/0.7.0.post2/json \
            https://pypi.org/pypi/sgl-kernel-kt/0.3.21.post2/json \
            https://pypi.org/pypi/sgl-kernel-kt-payload-1/0.3.21.post2/json \
            https://pypi.org/pypi/sgl-kernel-kt-payload-2/0.3.21.post2/json \
            https://pypi.org/pypi/sgl-kernel-kt-payload-3/0.3.21.post2/json \
            https://pypi.org/pypi/sgl-kernel-kt-payload-4/0.3.21.post2/json \
            https://pypi.org/pypi/sgl-kernel-kt-payload-5/0.3.21.post2/json \
            https://pypi.org/pypi/transformers-kt/5.6.0.post4/json; do
            for attempt in $(seq 1 30); do
              status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$url")"
              if [ "$status" = "200" ]; then
                break
              fi
              test "$attempt" -lt 30
              sleep 10
            done
          done
