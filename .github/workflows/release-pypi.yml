name: Publish frozen GLM hotfix wheels

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Must be pypi"
        required: true
        default: pypi
        type: choice
        options:
          - pypi

permissions:
  contents: read

concurrency:
  group: ktransformers-pypi-release
  cancel-in-progress: false

jobs:
  publish-frozen-wheels:
    name: Verify and publish frozen wheels
    if: github.repository == 'kvcache-ai/ktransformers' && inputs.target == 'pypi'
    runs-on: [self-hosted, linux, x64, gpu, kt-cpu]
    environment: prod

    env:
      RELEASE_ROOT: /home/yyj/kt-hotfix-release-20260827

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify immutable release artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd "$RELEASE_ROOT/final-dist-v9/release"
          sha256sum --check <<'EOF'
          b44b68effe42f7cfbfe9bb8e07af57ef29194c3648e20a1fdd06273b42aca7ca  kt_kernel-0.7.0.post2-cp312-cp312-manylinux_2_35_x86_64.whl
          1bf1e51e115314388e41aeed5d7c380985bf67a448e8133af1e7ff81de5d9f8f  ktransformers-0.7.0.post2-py3-none-manylinux_2_35_x86_64.whl
          b13705d35c577530efaec915b02ba66a6bf67f88a5429f4758bb59885e723971  sglang_kt-0.7.0.post2-py3-none-manylinux_2_35_x86_64.whl
          b8e7c1baeb19123b251dfb4f6e6c2be615abd29b6feb23113deeaef5e7175811  transformers_kt-5.6.0.post4-py3-none-manylinux_2_35_x86_64.whl
          EOF

      - name: Confirm existing files match the frozen release
        shell: bash
        run: |
          set -euo pipefail
          verify_or_unused() {
            local package="$1" version="$2" expected="$3" response status
            response="$(mktemp)"
            status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
              "https://pypi.org/pypi/$package/$version/json")"
            if [ "$status" = "404" ]; then
              rm -f "$response"
              echo "$package==$version is unused"
              return 0
            fi
            test "$status" = "200"
            python - "$response" "$expected" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          expected = sys.argv[2]
          hashes = {item["digests"]["sha256"] for item in payload["urls"]}
          if hashes != {expected}:
              raise SystemExit(f"unexpected PyPI hashes: {sorted(hashes)}")
          PY
            rm -f "$response"
            echo "$package==$version already contains the frozen wheel"
          }

          verify_or_unused kt-kernel 0.7.0.post2 b44b68effe42f7cfbfe9bb8e07af57ef29194c3648e20a1fdd06273b42aca7ca
          verify_or_unused ktransformers 0.7.0.post2 1bf1e51e115314388e41aeed5d7c380985bf67a448e8133af1e7ff81de5d9f8f
          verify_or_unused sglang-kt 0.7.0.post2 b13705d35c577530efaec915b02ba66a6bf67f88a5429f4758bb59885e723971
          verify_or_unused transformers-kt 5.6.0.post4 b8e7c1baeb19123b251dfb4f6e6c2be615abd29b6feb23113deeaef5e7175811

      - name: Install publisher and validate metadata
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade twine
          python -m twine check "$RELEASE_ROOT/final-dist-v9/release/"*.whl

      - name: Publish exact tested wheels to PyPI
        shell: bash
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TWINE_PASSWORD"
          upload_with_retry() {
            local wheel="$1"
            for attempt in 1 2 3 4 5 6; do
              if python -m twine upload --non-interactive --skip-existing "$wheel"; then
                sleep 30
                return 0
              fi
              echo "Upload attempt $attempt failed; waiting before retry"
              sleep $((attempt * 30))
            done
            echo "Failed to upload $wheel after 6 attempts" >&2
            return 1
          }

          upload_with_retry \
            "$RELEASE_ROOT/final-dist-v9/release/kt_kernel-0.7.0.post2-cp312-cp312-manylinux_2_35_x86_64.whl"
          upload_with_retry \
            "$RELEASE_ROOT/final-dist-v9/release/transformers_kt-5.6.0.post4-py3-none-manylinux_2_35_x86_64.whl"
          upload_with_retry \
            "$RELEASE_ROOT/final-dist-v9/release/sglang_kt-0.7.0.post2-py3-none-manylinux_2_35_x86_64.whl"
          upload_with_retry \
            "$RELEASE_ROOT/final-dist-v9/release/ktransformers-0.7.0.post2-py3-none-manylinux_2_35_x86_64.whl"

      - name: Verify exact PyPI files
        shell: bash
        run: |
          set -euo pipefail
          verify_exact() {
            local package="$1" version="$2" expected="$3" response status
            response="$(mktemp)"
            for attempt in $(seq 1 30); do
              status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
                "https://pypi.org/pypi/$package/$version/json")"
              [ "$status" = "200" ] && break
              test "$attempt" -lt 30
              sleep 10
            done
            test "$status" = "200"
            python - "$response" "$expected" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          expected = sys.argv[2]
          hashes = {item["digests"]["sha256"] for item in payload["urls"]}
          if hashes != {expected}:
              raise SystemExit(f"unexpected PyPI hashes: {sorted(hashes)}")
          PY
            rm -f "$response"
          }

          verify_exact kt-kernel 0.7.0.post2 b44b68effe42f7cfbfe9bb8e07af57ef29194c3648e20a1fdd06273b42aca7ca
          verify_exact ktransformers 0.7.0.post2 1bf1e51e115314388e41aeed5d7c380985bf67a448e8133af1e7ff81de5d9f8f
          verify_exact sglang-kt 0.7.0.post2 b13705d35c577530efaec915b02ba66a6bf67f88a5429f4758bb59885e723971
          verify_exact transformers-kt 5.6.0.post4 b8e7c1baeb19123b251dfb4f6e6c2be615abd29b6feb23113deeaef5e7175811
