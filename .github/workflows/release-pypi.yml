name: Publish frozen GLM hotfix wheels

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Must be pypi"
        required: true
        default: pypi
        type: choice
        options:
          - pypi

permissions:
  contents: read

concurrency:
  group: ktransformers-pypi-release
  cancel-in-progress: false

jobs:
  publish-frozen-wheels:
    name: Verify and publish frozen wheels
    if: github.repository == 'kvcache-ai/ktransformers' && inputs.target == 'pypi'
    runs-on: [self-hosted, linux, x64, gpu, kt-cpu]
    environment: prod

    env:
      RELEASE_ROOT: /home/yyj/kt-hotfix-release-20260827

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify immutable release artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd "$RELEASE_ROOT/final-dist-v7/release"
          sha256sum --check <<'EOF'
          88149a0b79d94bf5e084fc32efaacca8077357902ffed803c46eadc48d0fa36a  ktransformers-0.7.0.post2-py3-none-manylinux_2_35_x86_64.whl
          90918ca7b5154d882e13c1792a2a626c145033f05c2ab3366f8424f388010053  sgl_kernel_kt-0.3.21.post2-cp310-abi3-manylinux_2_35_x86_64.whl
          824c6991e9ed3eefacf9207524189234a9ad75f35364791d3c7408d4c1b5ef4b  sglang_kt-0.7.0.post2-py3-none-manylinux_2_35_x86_64.whl
          d82eba7e8c391d3d6d973e33aeec2f828e5652e35d64d019b91ea4bba8e915b5  transformers_kt-5.6.0.post4-py3-none-manylinux_2_35_x86_64.whl
          EOF

      - name: Confirm existing files match the frozen release
        shell: bash
        run: |
          set -euo pipefail
          verify_or_unused() {
            local package="$1" version="$2" expected="$3" response status
            response="$(mktemp)"
            status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
              "https://pypi.org/pypi/$package/$version/json")"
            if [ "$status" = "404" ]; then
              rm -f "$response"
              echo "$package==$version is unused"
              return 0
            fi
            test "$status" = "200"
            python - "$response" "$expected" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          expected = sys.argv[2]
          hashes = {item["digests"]["sha256"] for item in payload["urls"]}
          if hashes != {expected}:
              raise SystemExit(f"unexpected PyPI hashes: {sorted(hashes)}")
          PY
            rm -f "$response"
            echo "$package==$version already contains the frozen wheel"
          }

          verify_or_unused ktransformers 0.7.0.post2 88149a0b79d94bf5e084fc32efaacca8077357902ffed803c46eadc48d0fa36a
          verify_or_unused sglang-kt 0.7.0.post2 824c6991e9ed3eefacf9207524189234a9ad75f35364791d3c7408d4c1b5ef4b
          verify_or_unused sgl-kernel-kt 0.3.21.post2 90918ca7b5154d882e13c1792a2a626c145033f05c2ab3366f8424f388010053
          verify_or_unused transformers-kt 5.6.0.post4 d82eba7e8c391d3d6d973e33aeec2f828e5652e35d64d019b91ea4bba8e915b5

      - name: Install publisher and validate metadata
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade twine
          python -m twine check "$RELEASE_ROOT/final-dist-v7/release/"*.whl

      - name: Publish exact tested wheels to PyPI
        shell: bash
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TWINE_PASSWORD"
          upload_with_retry() {
            local wheel="$1"
            for attempt in 1 2 3 4 5 6; do
              if python -m twine upload --non-interactive --skip-existing "$wheel"; then
                sleep 30
                return 0
              fi
              echo "Upload attempt $attempt failed; waiting before retry"
              sleep $((attempt * 30))
            done
            echo "Failed to upload $wheel after 6 attempts" >&2
            return 1
          }

          upload_with_retry \
            "$RELEASE_ROOT/final-dist-v7/release/sgl_kernel_kt-0.3.21.post2-cp310-abi3-manylinux_2_35_x86_64.whl"
          upload_with_retry \
            "$RELEASE_ROOT/final-dist-v7/release/transformers_kt-5.6.0.post4-py3-none-manylinux_2_35_x86_64.whl"
          upload_with_retry \
            "$RELEASE_ROOT/final-dist-v7/release/sglang_kt-0.7.0.post2-py3-none-manylinux_2_35_x86_64.whl"
          upload_with_retry \
            "$RELEASE_ROOT/final-dist-v7/release/ktransformers-0.7.0.post2-py3-none-manylinux_2_35_x86_64.whl"

      - name: Verify exact PyPI files
        shell: bash
        run: |
          set -euo pipefail
          verify_exact() {
            local package="$1" version="$2" expected="$3" response status
            response="$(mktemp)"
            for attempt in $(seq 1 30); do
              status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
                "https://pypi.org/pypi/$package/$version/json")"
              [ "$status" = "200" ] && break
              test "$attempt" -lt 30
              sleep 10
            done
            test "$status" = "200"
            python - "$response" "$expected" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          expected = sys.argv[2]
          hashes = {item["digests"]["sha256"] for item in payload["urls"]}
          if hashes != {expected}:
              raise SystemExit(f"unexpected PyPI hashes: {sorted(hashes)}")
          PY
            rm -f "$response"
          }

          verify_exact ktransformers 0.7.0.post2 88149a0b79d94bf5e084fc32efaacca8077357902ffed803c46eadc48d0fa36a
          verify_exact sglang-kt 0.7.0.post2 824c6991e9ed3eefacf9207524189234a9ad75f35364791d3c7408d4c1b5ef4b
          verify_exact sgl-kernel-kt 0.3.21.post2 90918ca7b5154d882e13c1792a2a626c145033f05c2ab3366f8424f388010053
          verify_exact transformers-kt 5.6.0.post4 d82eba7e8c391d3d6d973e33aeec2f828e5652e35d64d019b91ea4bba8e915b5
