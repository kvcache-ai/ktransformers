# Native FP8 frozen expert base, GPU BF16, real LoRA optimizer updates.
model_name_or_path: /path/to/DeepSeek-V3.1
trust_remote_code: false
flash_attn: sdpa
disable_gradient_checkpointing: false
stage: sft
do_train: true
do_eval: false
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.0
lora_target: all
# DeepSeek's FP32 router requires FP32 LoRA masters under this FSDP2 stack.
# The frozen CPU expert base remains native FP8; GPU compute remains BF16.
pure_bf16: false
dataset: dsv31_tokenized_fixture
tokenized_path: /path/to/tokenized-fixture
template: deepseek3
cutoff_len: 1024
packing: false
preprocessing_num_workers: 1
dataloader_num_workers: 0
disable_shuffling: true
logging_steps: 1
logging_nan_inf_filter: false
save_strategy: "no"
plot_loss: false
overwrite_output_dir: false
save_only_model: true
report_to: none
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-4
weight_decay: 0.0
optim: adamw_torch_fused
lr_scheduler_type: cosine
warmup_ratio: 0.1
max_grad_norm: 1.0
bf16: true
fp8: false
seed: 42
data_seed: 42
include_num_input_tokens_seen: non_padding
ddp_timeout: 1800
eval_strategy: "no"
load_best_model_at_end: false
use_kt: true
kt_cpu_activation: retain
kt_config:
  kt_expert_weight_format: fp8
  kt_backend: auto
  kt_weight_lifecycle: persistent
  kt_num_threads: 64
  kt_tp_enabled: true
  kt_threadpool_count: 2
  kt_max_cache_depth: 2
  kt_share_backward_bb: true
  kt_num_gpu_experts: 0
  kt_force_fused_expert_lora: true
  kt_model_max_length: 1152
